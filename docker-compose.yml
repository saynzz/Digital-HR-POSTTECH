services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: janamen
      POSTGRES_USER: janamen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janamen}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janamen"]
      interval: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen2.5:3b}"]
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://janamen:${POSTGRES_PASSWORD:-janamen}@db:5432/janamen
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      HR_SYSTEM_PROVIDER: mock
      DOCFLOW_PROVIDER: mock
      COMPANY_NAME: ${COMPANY_NAME:-ТОО «Jana Post»}
      ZUP_URL: ${ZUP_URL:-}
      ZUP_USER: ${ZUP_USER:-}
      ZUP_PASSWORD: ${ZUP_PASSWORD:-}
      ZUP_FIELD_MAP: ${ZUP_FIELD_MAP:-}
      ZUP_VERIFY_TLS: ${ZUP_VERIFY_TLS:-true}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      RESET_DB_ON_SCHEMA_CHANGE: ${RESET_DB_ON_SCHEMA_CHANGE:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-auto}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-JanaMen · Jana Post}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      EXPOSE_INVITE_LINKS: ${EXPOSE_INVITE_LINKS:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-demo123}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
  ollama_data:
